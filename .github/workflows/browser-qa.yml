name: Static PWA browser QA
on:
  pull_request:
  push:
    branches: ['clinic/mobile-pwa-*']
permissions:
  contents: read
concurrency:
  group: clinic-pwa-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Bounded summary
        if: always()
        run: |
          echo '## Static PWA browser QA' >> "$GITHUB_STEP_SUMMARY"
          echo 'Node tests and Chromium/WebKit mobile-emulation tests run on synthetic text only. See step status; no traces, videos, or data artifacts uploaded. This does not validate real iOS/Android dictation or clinical readiness.' >> "$GITHUB_STEP_SUMMARY"
